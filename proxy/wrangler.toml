# easysmarky リバースプロキシの Cloudflare Worker 設定。
# デプロイは運用者の Cloudflare アカウントで行う(proxy/README.md 参照)。
# 公開せず私的利用にとどめること。

name = "easysmarky-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# 独自ドメインで公開する場合は、下をコメント解除して自分のゾーンに合わせる。
# workers.dev のサブドメインで使う場合は不要(ダッシュボードで有効化)。
# routes = [
#   { pattern = "smarky.example.com", custom_domain = true }
# ]
