# easysmarky リバースプロキシの Cloudflare Worker 設定。
# デプロイは運用者の Cloudflare アカウントで行う(proxy/README.md 参照)。
# 公開せず私的利用にとどめること。

name = "easysmarky-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
# 学校のURLプレフィックス。本家のログイン画面を開いたときのアドレスバー
#   https://digi-repo.smarky.jp/#/XXXXX/student_site/sign_in
# の XXXXX の部分を入れる。
#
# 設定すると、プロキシのルートURLを開いたときに自動でログイン画面のハッシュを補う。
# 空のままだと、毎回 https://<worker>/#/XXXXX/student_site/sign_in と手で打つ必要がある
# (ハッシュ無しで開くとログイン時に「URLが不正です」になる)。
SCHOOL_URL_PREFIX = ""

# 独自ドメインで公開する場合は、下をコメント解除して自分のゾーンに合わせる。
# workers.dev のサブドメインで使う場合は不要(ダッシュボードで有効化)。
# routes = [
#   { pattern = "smarky.example.com", custom_domain = true }
# ]
