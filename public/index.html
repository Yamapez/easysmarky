<h1>easysmarky</h1>
<p>Smarkyのデジタルレポート入力を楽にするスクリプトを配信しています。
導入方法はブックマークレット版とユーザースクリプト版の2通りあり、どちらか一方でかまいません。</p>
<ul>
  <li>ブックマークレット版: <code>easysmarky.iife.js</code></li>
  <li>ユーザースクリプト版(Tampermonkeyなど):
    <a href="https://yamapez.github.io/easysmarky/easysmarky.user.js"><code>easysmarky.user.js</code></a>
    — インストール後は自動で更新されます</li>
</ul>
<p>使い方・登録手順は
<a href="https://github.com/Yamapez/easysmarky#readme">GitHubリポジトリのREADME</a>
をご覧ください。</p>
