name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Determine current version
        id: version
        run: echo "current=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fetch deployed version
        id: deployed
        run: |
          git fetch origin gh-pages --depth 1
          DEPLOYED=$(git show origin/gh-pages:easysmarky.user.js | grep -oE '@version +[0-9.]+' | awk '{print $2}' || true)
          echo "version=${DEPLOYED:-none}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ steps.version.outputs.current }}" = "${{ steps.deployed.outputs.version }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json version ${{ steps.version.outputs.current }} is already deployed to gh-pages. Skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Chrome
        if: steps.gate.outputs.skip != 'true'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build & UI regression check
        if: steps.gate.outputs.skip != 'true'
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify

      - name: Publish dist to gh-pages
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add ../gh-pages-deploy origin/gh-pages
          cp dist/easysmarky.iife.js dist/easysmarky.user.js ../gh-pages-deploy/
          cd ../gh-pages-deploy
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git add easysmarky.iife.js easysmarky.user.js
          git commit -m "v${{ steps.version.outputs.current }}: mainと同期(CI自動デプロイ)"
          git push origin HEAD:gh-pages
