<script>
// ============================================================
// ダミーのページ画像
//
// rim の座標系は base_sheet.correct_image_size(ページごとの [w,h])。
// 実機ではこれがページ画像の実解像度と一致するが、ハーネスではわざと食い違わせて
// おく。そうしないと「rim をそのままページ画像のピクセルとして扱う」実装ミスも、
// 「naturalWidth を rim の座標系だと思い込む」実装ミスも検出できない。
// 描画はすべて rim の座標系で書き、ctx.scale() で解像度倍率を掛ける。
//
// ページごとに用紙サイズも解像度倍率も変えてある(correct_image_size がページ単位で
// 持つ以上ありうるため。全ページ共通の1組だと思い込む実装をここで落とす)。
// ============================================================
const PAGE_BG_ANSWER = "#fffdf5";

/** 解答用紙ページ。sheet が rim の座標系(= correct_image_size)、scale が画像解像度の倍率 */
const ANSWER_PAGES = [
  { sheet: [1000, 1400], scale: 2 },
  { sheet: [800, 1120], scale: 1.25 },
];
/** 問題ページ。解答用紙とも互いとも違う倍率にしておく */
const QUESTION_PAGES = [
  { sheet: [1000, 1400], scale: 1.5 },

// 解答欄の唯一の出所。REPORT の rim も、ページ画像に描く枠も、ここから作る。
// 塗り色は「切り出した範囲が本当に解答欄と重なっているか」を画素で確かめるための目印。
const RIMS = [
  { id: 1, page: 1, part3: "ア", rim: [40, 400, 920, 120], fill: "#ffe3e3" },
  { id: 2, page: 1, part3: "イ", rim: [40, 600, 920, 120], fill: "#e3ffe8" },
  // 画像型(answer_type:5)の編集不可設問。幅300/1000のように小さめにして、
  // 設問へジャンプしたときの自動ズームも一緒に検証できるようにする。
  // (選択式は選択肢があれば編集できるので、ここは画像型にしている)
  { id: 4, page: 1, part3: "エ", rim: [40, 780, 300, 100], fill: "#f2e3ff", type: 5 },
  // 2ページ目(用紙サイズも解像度も1ページ目と違う)の、用紙左端に接する解答欄。
  // cut_margin ぶんが用紙の外へ出るので、切り出しのクランプ(src/ui/cropPreview.ts)も

  { id: 3, page: 2, part3: "ウ", rim: [0, 800, 760, 120], fill: "#e3e9ff", type: 3 },
  // 縦長の解答欄(実機の「1文字だけ書く縦書きの解答欄」に相当)。
  // これが無いと canvas の max-height 上限が当たる経路を一度も通らず、
  // 「幅だけ指定して height:auto に任せる」= 高さだけ潰れて横に伸びる不具合
  // (v0.8.0)を検出できない。他の解答欄はすべて横長で、幅で先に頭打ちになる。
  // 用紙 800x1120・余白36 → 切り出し 172x332 → 画像ピクセル(1.25倍)で 215x415。
  // 1ページ目に置くと設問ストリップの添字がずれて既存の検査を巻き込むので2ページ目。
  { id: 5, page: 2, part3: "オ", rim: [620, 300, 100, 260], fill: "#ffefc2" },
  // 記号問題(answer_type:4・選択式)。選択肢は配列で返し、既存の答えは「ウ」(answer_texts[0] が既にある形)。
  // 2ページ目の末尾に置くので、1ページ目の検査(設問ア・イ・エ)や「次の未入力」の連鎖は変わらない。
  // 設問の並びは page→id 順なので、オ の後ろに来る。
  { id: 6, page: 2, part3: "カ", rim: [40, 480, 500, 100], fill: "#e6fff9", type: 4, choices: ["ア", "イ", "ウ", "エ"], existing: "ウ" },
  // 手書きのみ(answer_type:2)の編集不可設問。末尾に置き、ア〜カの件数や連鎖に影響させない。
  // 編集不可カードは「手書きのみ」の理由を出す(drive.mjs で見る)。
  { id: 7, page: 2, part3: "キ", rim: [40, 960, 500, 100], fill: "#fff0e6", type: 2 },
];

function makePage(text, lines, bg, page, rims) {
  const [sw, sh] = page.sheet;
  const c = document.createElement("canvas");
  c.width = sw * page.scale; c.height = sh * page.scale;
  const g = c.getContext("2d");
  g.scale(page.scale, page.scale);
  g.fillStyle = bg; g.fillRect(0, 0, sw, sh);
  g.fillStyle = "#111";
  g.font = "bold 34px sans-serif";
  g.fillText(text, 40, 60);
  g.font = "26px sans-serif";
  lines.forEach((l, i) => g.fillText(l, 40, 130 + i * 44));
  for (const r of rims) {
    const [x, y, w, h] = r.rim;
    g.fillStyle = r.fill;
    g.fillRect(x, y, w, h);
    g.strokeStyle = "#888"; g.lineWidth = 2;
    g.strokeRect(x, y, w, h);
  }
  return c.toDataURL("image/png");
}
const rimsOfPage = (p) => RIMS.filter((r) => r.page === p);

const QUESTION_PAGE_1 = makePage("問題 第1回", [
  "問1 次の文章を読んで、下の問いに答えなさい。",
  "  日本の高度経済成長期には、都市部への人口集中が進み、",
  "  地方では過疎化が問題となった。",
  "(1) 高度経済成長期はおよそ何年から何年までか答えなさい。",
  "(2) 過疎化が地域社会に与えた影響を60字以内で述べなさい。",
], "#ffffff", QUESTION_PAGES[0], rimsOfPage(1));

const QUESTION_PAGE_2 = makePage("問題 第1回(2ページ目)", [
  "問2 次の語句について説明しなさい。",
  "(1) ドーナツ化現象",
  "(2) Uターン現象",
], "#ffffff", QUESTION_PAGES[1], rimsOfPage(2));

const ANSWER_PAGE_1 = makePage("解答用紙 第1回", [
  "問1(1) 解答欄 ↓",
], PAGE_BG_ANSWER, ANSWER_PAGES[0], rimsOfPage(1));

const ANSWER_PAGE_2 = makePage("解答用紙 第1回(2ページ目)", [
  "問1(3) 解答欄 ↓",
], PAGE_BG_ANSWER, ANSWER_PAGES[1], rimsOfPage(2));

// ============================================================
// ダミーAPIレスポンス
// ============================================================
const CURRENT_USER = {

          school: { id: 85, name: "テスト高校" } },
};

const SHEET_LIST = {
  student_subject_rows: [{
    student_subject: { subject_code: "JPN", nendo: 2025, report_count: 1, subject_name: "国語総合" },
    student_sheets: [null],
    base_sheets: [{
      id: 1001, sheet_code: "JPN-1", report_no: 1, answer_image_completed: false,
      is_published: true, publish_at: null,
      std_deadline_at: "2026-08-31T00:00:00Z", final_deadline_at: null, sheet_type: 1,
    }],
  }],

function field(id, page, part3, rim, answerTexts, answerType, choices) {

// 記号問題カの既存の答え「ウ」。位置は null(保存時に中央へ置かれる)
const EXISTING_CHOICE_TEXT = {
  id: 13, base_sheet_field_id: 6, idx: 0,
  text: "ウ", color: "#000000",
  font_size: 32, line_height: 0,
  x: null, y: null, width: null, height: null, direction: 1,
};

// 設問1は「下書きを再開した」状態を再現するため、既存の answer_texts を持たせる。
// これが無いと updatePreview() の空テキスト早期returnに入り、
// スマホ初期表示(入力ペインが display:none)からの復帰経路を検証できない。
const EXISTING_TEXT = {
  id: 11, base_sheet_field_id: 1, idx: 0,
  text: "既存の下書きテキスト", color: "#000000",
  font_size: 40, line_height: 1.2,
  x: null, y: null, width: null, height: null, direction: 1,
};

// 縦長の設問オも入力済みにしておく。空だと「次の未入力へ」がここで止まってしまい、
// 末尾から先頭へ巻き戻る検査(nextEmptyWrap)が成立しない。
// 縦書き(direction:2)にして、実機の1文字解答欄と同じ経路を通す。
const EXISTING_TALL_TEXT = {
  id: 12, base_sheet_field_id: 5, idx: 0,
  text: "ア", color: "#000000",
  font_size: 40, line_height: 1.2,
  x: null, y: null, width: null, height: null, direction: 2,
};

// base_sheet は実機が返す形に合わせること。実機に width / height は無く、
// rim の座標系は correct_image_size(ページごとの [w,h] を並べたフラット配列)から取る。
// ここに width / height を足すと、実機で枠が出ない不具合を検出できなくなる。
const REPORT = {
  base_sheet: {
    id: 1001, sheet_type: 1, dpi: 200,
    page_count: ANSWER_PAGES.length,
    question_page_count: QUESTION_PAGES.length,
    correct_image_size: ANSWER_PAGES.flatMap((p) => p.sheet),
    question_image_size: QUESTION_PAGES.flatMap((p) => p.sheet),
  },
  base_sheet_fields: RIMS.map((r) =>
    field(r.id, r.page, r.part3, r.rim,
          r.id === 1 ? [EXISTING_TEXT]
            : r.id === 5 ? [EXISTING_TALL_TEXT]
            : r.id === 6 ? [EXISTING_CHOICE_TEXT]
            : [],
          r.type ?? 1,
          r.choices)),
  base64_question_images: [QUESTION_PAGE_1, QUESTION_PAGE_2],
  base64_answer_images: [ANSWER_PAGE_1, ANSWER_PAGE_2],
  message: null, before_student_sheet_id: null, subject_name: "国語総合 第1回",
  cut_margin: 20, scored_user_name: null,
  answer_image_discriptions: [], question_image_discriptions: [],
  rejection_student_sheet_log: null, status: 1, movie_contents: [],
};

// ============================================================
// シナリオ(?scenario=dN)。tools/verify/harness-dN.js が登録した設定を読む。
// 指定が無いと SCN は空になり、従来の挙動と完全に同じ。担当は自分の dN の設定だけを書く。
//   sheetList:        SHEET_LIST の代わりに返す一覧データ
//   delayMs:          { list, digitalReport, save } 各 API 応答を遅らせるミリ秒
//   skipWriteBackIds: 保存時に REPORT へ書き戻さない設問 id の配列(保存後照合の不一致を作る)
//   seedStorage:      フォームを開く前に localStorage へ入れる { キー: 文字列 }
// ============================================================
const SCENARIO_NAME = new URLSearchParams(location.search).get("scenario");
const SCN = (window.__esScenarios && SCENARIO_NAME && window.__esScenarios[SCENARIO_NAME]) || {};
const scnDelay = (ms) => (ms ? new Promise((r) => setTimeout(r, ms)) : null);
// 保存成功後に localStorage に残ってよいキー(下書きのバックアップ以外)。新しい永続キーを足したら書く
// 退避(easysmarky:archive:)は、古い下書きを上書きから守るための別のキー。下書きの後始末とは別に残りうる
const KEEP_AFTER_SAVE = [":summary:", "easysmarky:hint-", "easysmarky:last:", "easysmarky:prefs", "easysmarky:archive:"];

// ============================================================
// fetch スタブ(保存はステートフル: 保存された answer_texts を REPORT に書き戻す)
// ============================================================
const POST_LOG = [];
// 失敗の注入。次の1回だけ通信が落ちたように振る舞わせる(接続段階の失敗 = TypeError)
//   saveNetwork: 保存の POST を落とす / verifyOnce: 保存後の再取得(照合)を落とす
window.__esFail = { saveNetwork: false, verifyOnce: false };
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = String(input);
  const json = (obj) => new Response(JSON.stringify(obj), {
    status: 200, headers: { "Content-Type": "application/json" },
  });
  if (url.startsWith("/api/current_user")) return json(CURRENT_USER);
  if (url.startsWith("/api/student/student_sheet_list")) {
    await scnDelay(SCN.delayMs?.list);
    return json(SCN.sheetList || SHEET_LIST);
  }

  if (url.startsWith("/api/student/digital_report/save")) {
    if (window.__esFail.saveNetwork) {
      window.__esFail.saveNetwork = false;
      throw new TypeError("Failed to fetch");
    }
    await scnDelay(SCN.delayMs?.save);
    const form = init && init.body;
    const entry = { zipBytes: null, fieldCount: 0, texts: [], error: null };
    try {
      const file = form.get("file");
      entry.zipBytes = file ? file.size : null;
      const params = JSON.parse(form.get("param_base_sheet_fields"));
      entry.fieldCount = params.length;
      // 選択式など、個々の設問の送信内容(位置・大きさ・文字)を検査で見られるように残す
      entry.answerTexts = params.map((p) => ({ id: p.id, answer_texts: p.answer_texts }));
      // 実サーバと同じく、保存された内容が以後のGETに反映されるようにする
      for (const p of params) {
        const target = REPORT.base_sheet_fields.find((f) => f.id === p.id);
        if (target && !(SCN.skipWriteBackIds || []).includes(p.id)) target.answer_texts = p.answer_texts || [];
        entry.texts.push({ id: p.id, text: (p.answer_texts && p.answer_texts[0] && p.answer_texts[0].text) || "" });
      }
    } catch (e) {
      entry.error = String(e);
    }
    POST_LOG.push(entry);
    return json({ ok: true });
  }

  if (url.startsWith("/api/student/digital_report")) {
    if (window.__esFail.verifyOnce) {
      window.__esFail.verifyOnce = false;
      throw new TypeError("Failed to fetch");
    }
    await scnDelay(SCN.delayMs?.digitalReport);
    return json(REPORT);
  }
  return realFetch(input, init);
};

// 前回の実行が残した下書き・進捗キャッシュを消してから始める
try {
  for (const key of Object.keys(localStorage)) {
    if (key.startsWith("easysmarky:")) localStorage.removeItem(key);
  }
  // シナリオが指定した初期データは、消去のあと・オーバーレイを開く前に入れる
  for (const [key, value] of Object.entries(SCN.seedStorage || {})) localStorage.setItem(key, value);
} catch (e) { /* localStorage が使えない環境は無視 */ }

// ============================================================
// 自動駆動 (?auto=assert | ?auto=view)
// ============================================================
const params = new URLSearchParams(location.search);
const AUTO = params.get("auto");
const MODE = params.get("mode") || "view";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, label, timeout = 8000) {
  const start = Date.now();
  for (;;) {
    let v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    if (Date.now() - start > timeout) throw new Error("timeout waiting for " + label);
    await sleep(50);
  }
}
const shadow = () => {
  const host = document.getElementById("easysmarky-host");
  return host && host.shadowRoot;
};
const q = (sel) => { const s = shadow(); return s && s.querySelector(sel); };
const qa = (sel) => { const s = shadow(); return s ? Array.from(s.querySelectorAll(sel)) : []; };
/** 同じクラスの要素がPC用/スマホ用に複数あるので、いま画面に出ている方を選ぶ */
const visible = (sel) => qa(sel).find((el) => el.getBoundingClientRect().width > 0) || null;

/** 表示中の1設問エディタのプレビュー状態 */
function overlayState() {
  const wrap = q(".es-preview-wrap");
  if (!wrap) return null;
  const canvas = wrap.querySelector("canvas.es-crop");
  const img = wrap.querySelector(".es-preview-overlay");
  if (!canvas || !img) return null;
  const box = canvas.getBoundingClientRect();
  const slot = wrap.closest(".es-preview-slot");
  const px = (v) => (v ? parseFloat(v) : null);
  return {
    renderedWidth: Math.round(box.width * 100) / 100,
    renderedHeight: Math.round(box.height * 100) / 100,
    // 表示に使える幅。canvas はこれいっぱいに広がるはず(intrinsic のまま
    // 置くと解答欄の大きさ次第で表示が桁違いになる)
    slotWidth: slot ? Math.round(slot.getBoundingClientRect().width * 100) / 100 : null,
    // canvas の内部解像度は「ページ画像のピクセル数」であって base_sheet の座標系ではない
    intrinsicWidth: canvas.width,
    intrinsicHeight: canvas.height,
    display: img.style.display,
    width: img.style.width,
    left: img.style.left,
    // 文字画像の中心。解答欄の中心と一致しているはず(フォント実測値に依存しない検査)
    centerX: px(img.style.left) != null ? px(img.style.left) + px(img.style.width) / 2 : null,
    centerY: px(img.style.top) != null ? px(img.style.top) + px(img.style.height) / 2 : null,
    // updatePreview が使うスケールと、実際に当たっている幅の比が一致するか照合する材料
    scale: canvas.width ? Math.round((box.width / canvas.width) * 10000) / 10000 : null,
    // 表示は canvas の内部解像度の縦横比を必ず保つはず。幅だけ指定して
    // height:auto に任せると max-height が当たったとき高さだけ潰れてここが食い違う
    intrinsicRatio: canvas.height ? Math.round((canvas.width / canvas.height) * 10000) / 10000 : null,
    renderedRatio: box.height ? Math.round((box.width / box.height) * 10000) / 10000 : null,
    // updatePreview が読むのと同じ「いま効いている高さの上限」
    maxHeightPx: (() => {
      const v = getComputedStyle(canvas).maxHeight;
      return v && v.endsWith("px") ? parseFloat(v) : null;
    })(),
  };
}

/** 切り出し canvas の内部解像度。非表示でも読める(display:none でも width 属性は残る) */
function cropSize(sel) {
  const c = q(sel);
  return c ? { intrinsicWidth: c.width, intrinsicHeight: c.height } : null;
}

/**
 * 切り出し canvas の画素を1点だけ読む(fx,fy は 0..1 の相対位置)。
 * ページ画像は同一オリジンの data URL なので canvas は汚染されず getImageData が使える。
 * 切り出しは等倍(ソース矩形 = destサイズ)なのでリサンプリングされず、色は完全一致で比べられる。
 */
function cropPixel(sel, fx, fy) {
  const c = q(sel);
  if (!c || !c.width) return null;
  const x = Math.min(c.width - 1, Math.max(0, Math.round(c.width * fx)));
  const y = Math.min(c.height - 1, Math.max(0, Math.round(c.height * fy)));
  const d = c.getContext("2d").getImageData(x, y, 1, 1).data;
  return "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
}

function viewerTab(label) {
  return qa(".es-viewer-tabs button").find((b) => b.textContent === label) || null;
}

function zoomBtn(label) {
  return qa(".es-viewer-zoom button").find((b) => b.textContent === label) || null;
}

/** 枠の要素が、いま .es-viewer-scroll のビューポート内に完全に収まっているか */
function rimVisibleInScroll() {
  const rim = q(".es-rim.active");
  const scroll = q(".es-viewer-scroll");
  if (!rim || !scroll) return null;
  const r = rim.getBoundingClientRect();
  const s = scroll.getBoundingClientRect();
  return r.left >= s.left - 1 && r.right <= s.right + 1 && r.top >= s.top - 1 && r.bottom <= s.bottom + 1;
}

async function openSheet() {
  await waitFor(() => q(".es-list-item"), "sheet list");
  q(".es-list-item").click();
  await waitFor(() => q(".es-form"), "form");
  await waitFor(() => q(".es-field-editor .es-preview-wrap"), "field editor");
  await sleep(600); // 画像デコード + 初回プレビュー描画待ち
}

async function runAssertions() {
  const results = { mode: "assert", viewport: { w: innerWidth, h: innerHeight }, steps: {} };

  await openSheet();

  const isTwoPane = matchMedia("(min-width: 900px)").matches;

  await sleep(300);

  // --- 初回ヒント: 出る → 閉じる → 以後は保存されて出ない ---
  // 閉じておかないと、以降の縦方向のレイアウト検査がヒントぶんずれる
  results.steps.hint = { shownAtStart: qa(".es-hint").length === 1 };
  q(".es-hint button")?.click();
  await sleep(100);
  results.steps.hint.hiddenAfterDismiss = qa(".es-hint").length === 0;
  results.steps.hint.stored = localStorage.getItem("easysmarky:hint-dismissed") === "1";

  // --- 開いただけ・今の向きを押し直しただけでは未保存にならない ---
  const unloadNow = () => {
    const ev = new Event("beforeunload", { cancelable: true });
    window.dispatchEvent(ev);
    return ev.defaultPrevented;
  };
  results.steps.openState = {
    status: (q(".es-save-status").textContent || "").trim(),
    unloadPrevented: unloadNow(),
  };
  const activeDir = qa("button").find((b) => ["横書き", "縦書き"].includes(b.textContent) && b.classList.contains("active"));
  activeDir?.click();
  await sleep(100);
  results.steps.samePressState = {
    status: (q(".es-save-status").textContent || "").trim(),
    unloadPrevented: unloadNow(),
  };

  results.steps.initial = {
    twoPaneMediaQuery: isTwoPane,
    questionPaneDisplay: getComputedStyle(q(".es-pane-question")).display,
    formPaneDisplay: getComputedStyle(q(".es-pane-form")).display,
    stripChips: qa(".es-strip-chip").length,
    editorName: (q(".es-editor-name").textContent || "").trim(),
    progress: (q(".es-progress-count").textContent || "").trim(),
    // 初期表示は「問題」ページなので解答欄の枠は出ない(rim座標は解答用紙のもの)
    rimCount: qa(".es-rim").length,
    field1: overlayState(),
    // 切り出しの内部解像度は「ページ画像のピクセル」。rim をそのまま画像座標として
    // 使っていると、解答用紙が2倍解像度なので半分のサイズになる
    field1Crop: cropSize(".es-preview-wrap canvas.es-crop"),
    field1CropPixels: {
      center: cropPixel(".es-preview-wrap canvas.es-crop", 0.5, 0.5),     // 解答欄1の塗り色のはず
      margin: cropPixel(".es-preview-wrap canvas.es-crop", 0.004, 0.05),  // cut_margin の外側 = 用紙の地色
    },
    // 問題ページは解答用紙とさらに別解像度。各画像の naturalWidth で換算されているはず
    questionCrop: cropSize(".es-crop-question"),
    // 解答欄プレビューの横に置く問題プレビュー(目安の切り出し)はPC幅だけで見えるはず
    questionPreviewDisplay: getComputedStyle(q(".es-question-preview")).display,
    questionPreviewCanvasWidth: (() => {
      const c = q(".es-crop-question");
      return c ? Math.round(c.getBoundingClientRect().width) : null;
    })(),
  };

  // --- 解答用紙タブ: 解答欄の枠と凡例が出るか ---
  viewerTab("解答用紙").click();
  await sleep(400);
  const rimStyle = (i) => {
    const r = qa(".es-rim")[i];
    return r ? { left: r.style.left, top: r.style.top, width: r.style.width, height: r.style.height } : null;
  };
  results.steps.answerSheet = {
    rimCount: qa(".es-rim").length,
    lockedRims: qa(".es-rim.locked").length,
    filledRims: qa(".es-rim.filled").length,
    activeRims: qa(".es-rim.active").length,
    legendDisplay: getComputedStyle(q(".es-viewer-legend")).display,
    firstRimStyle: rimStyle(0),
    pagerLabel: (q(".es-viewer-count").textContent || "").trim(),
  };

  // --- 最重要: 解答欄をタップ → その設問が開き、テキストエリアにフォーカスが移るか ---
  // 常時分割レイアウトでは問題ビューアは隠れないので、rimタップ後の主動線は
  // 「テキストエリアへフォーカスが移って、すぐ入力できる」ことになる。
  // 枠が1つも出ていない場合でも run を最後まで走らせ、どのチェックが落ちたかを
  // 読めるようにする(枠が出ないこと自体は上の answerSheet のチェックが捕まえる)
  const firstRim = qa(".es-rim")[0];
  if (firstRim) firstRim.click();
  await sleep(1200);
  results.steps.afterRimTap = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    field1: overlayState(),
    textareaFocused: shadow().activeElement === q("textarea.es-textarea"),
  };
  await sleep(400);

  // --- 現在の枠の強調(選択中の枠だけ目立たせ、他は沈める) ---
  results.steps.emphasis = {
    hasActiveClass: q(".es-viewer-rims")?.classList.contains("has-active") ?? null,
    activeOpacity: (() => {
      const r = qa(".es-rim.active")[0];
      return r ? getComputedStyle(r).opacity : null;
    })(),
    otherOpacity: (() => {
      const r = qa(".es-rim:not(.active)")[0];
      return r ? getComputedStyle(r).opacity : null;
    })(),
  };

  // --- ズームは設問を切り替えても保持される(手動ズーム中は自動ズームで上書きしない) ---
  zoomBtn("＋").click();
  await sleep(200);
  results.steps.zoomPersist = { afterZoomIn: q(".es-viewer-canvas").style.width };
  qa(".es-strip-chip")[1].click(); // イ(同じページの別設問)
  await sleep(500);
  results.steps.zoomPersist.afterFieldSwitch = q(".es-viewer-canvas").style.width;

  // --- 手動ズームしていなければ、小さい解答欄(エ)へジャンプすると自動でズームする ---
  zoomBtn("全体").click();
  await sleep(200);
  qa(".es-strip-chip")[2].click(); // エ(編集不可・幅の狭い解答欄)
  await sleep(500);
  results.steps.autoZoom = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    canvasWidth: q(".es-viewer-canvas").style.width,
    lockedCardShown: !!q(".es-field-locked"),
  };

  // --- 別ページの設問を選ぶと、その枠が見える位置まで自動でパンする ---
  zoomBtn("全体").click();
  await sleep(200);
  qa(".es-strip-chip")[3].click(); // ウ(2ページ目)
  await sleep(1000);
  results.steps.autoPan = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    pagerLabel: (q(".es-viewer-count").textContent || "").trim(),
    rimVisible: rimVisibleInScroll(),
    // 編集欄(textarea)が実際に描画されていることも確かめる。施錠カードが無いだけでは true にしない
    editable: !q(".es-field-locked") && !!q("textarea.es-textarea"),
  };

  // --- 手書きのみ(answer_type:2)の設問は、その理由を出して編集不可にする ---
  qa(".es-strip-chip")[6].click(); // キ(2ページ目の末尾・手書きのみ)
  await sleep(400);
  results.steps.drawLocked = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    note: (q(".es-field-locked-note")?.textContent || "").trim(),
  };

  // --- Ctrl+↵ は編集不可の設問(エ)を飛ばす ---
  qa(".es-strip-chip")[1].click(); // イ
  await sleep(400);
  const beforeSkip = (q(".es-editor-name").textContent || "").trim();
  q("textarea.es-textarea").dispatchEvent(
    new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, composed: true }),
  );
  await sleep(400);
  results.steps.skipLocked = {
    before: beforeSkip,
    after: (q(".es-editor-name").textContent || "").trim(),
  };

  // --- 設問ストリップで移動できるか ---
  qa(".es-strip-chip")[3].click();
  await sleep(500);
  results.steps.stripNav = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    activeChipIndex: qa(".es-strip-chip").findIndex((c) => c.classList.contains("active")),
    // 設問3は2ページ目(用紙サイズも解像度も1ページ目と違う)の、用紙左端に接する解答欄。
    // 切り出しが用紙の外へ出ないか、ページごとの座標系で換算されているかを見る
    field3Crop: cropSize(".es-preview-wrap canvas.es-crop"),
    field3CenterPixel: cropPixel(".es-preview-wrap canvas.es-crop", 0.5, 0.5),
    // ビューアが2ページ目へ送られ、そのページの用紙サイズで枠が置かれるか
    pagerLabel: (q(".es-viewer-count").textContent || "").trim(),
    rimCount: qa(".es-rim").length,
    firstRimStyle: rimStyle(0),
  };

  // --- 縦長の解答欄: 高さの上限が当たっても縦横比が崩れないか ---
  // 設問オ(2ページ目・rim 100x260)は他と違って縦長なので、ここだけが
  // canvas の max-height に当たる経路を通る。横長の設問では幅で先に頭打ちになる。
  qa(".es-strip-chip")[4].click();
  await sleep(700);
  results.steps.tallField = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    field: overlayState(),
    crop: cropSize(".es-preview-wrap canvas.es-crop"),
    centerPixel: cropPixel(".es-preview-wrap canvas.es-crop", 0.5, 0.5),
  };

  // --- ResizeObserver: 幅を変えたら再計算されるか / ping-pong しないか ---
  // (既存テキストのある設問1に戻してから測る)
  qa(".es-strip-chip")[0].click();
  await sleep(700);
  const formPane = q(".es-pane-form");
  const img1 = q(".es-preview-overlay");
  let mutations = 0;
  const mo = new MutationObserver(() => { mutations++; });
  mo.observe(img1, { attributes: true, attributeFilter: ["style", "src"] });

  const before = overlayState();
  formPane.style.maxWidth = "320px";
  await sleep(400);
  const mutAt400 = mutations;
  const afterShrink = overlayState();
  await sleep(900);
  const mutAt1300 = mutations;

  formPane.style.maxWidth = "";
  await sleep(900);
  const afterRestore = overlayState();
  mo.disconnect();

  // overlayImg の幅は「テキストPNGの実寸 × scale」なので、
  // scale に比例していれば再計算が正しく効いている
  const ratio = (s) => (s && s.width && s.scale ? Math.round((parseFloat(s.width) / s.scale) * 100) / 100 : null);

  results.steps.resize = {
    before, afterShrink, afterRestore,
    pngWidthBefore: ratio(before),
    pngWidthAfterShrink: ratio(afterShrink),
    pngWidthAfterRestore: ratio(afterRestore),
    // 同じテキストなら PNG 実寸は変わらないはず。ズレていれば再計算が漏れている
    rescaledCorrectly:
      ratio(afterShrink) !== null && ratio(afterRestore) !== null
        ? Math.abs(ratio(afterShrink) - ratio(afterRestore)) < 1
        : null,
    mutationCallbacksAt400ms: mutAt400,
    mutationCallbacksAt1300ms: mutAt1300,
  };

  // --- 「次の未入力へ」で未入力の設問に移るか ---
  visible(".es-next-btn").click();
  await sleep(500);
  results.steps.nextEmpty = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    textareaValue: q("textarea.es-textarea").value,
  };

  // --- 続けて押すと未入力を辿りきり、先頭へ巻き戻って告知する ---
  visible(".es-next-btn").click(); // イ → ウ(まだ未入力を発見)
  await sleep(400);
  visible(".es-next-btn").click(); // ウ → 全員入力済みの ア を飛ばしてイへ巻き戻る
  await sleep(400);
  const toastEl = q(".es-toast");
  results.steps.nextEmptyWrap = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    toastVisible: toastEl ? toastEl.classList.contains("show") : null,
    toastText: toastEl ? toastEl.textContent : null,
  };

  // --- 入力 → プレビュー・進捗・ストリップの更新 ---
  const ta = q("textarea.es-textarea");
  ta.value = "都市部へ人口が流出し、地域の担い手が不足した。";
  ta.dispatchEvent(new Event("input", { bubbles: true }));
  await sleep(600);
  results.steps.typed = {
    field: overlayState(),
    progress: (q(".es-progress-count").textContent || "").trim(),
    filledDots: qa(".es-strip-dot.filled").length,
    fit: (q(".es-fit").textContent || "").trim(),
  };

  // --- 入力した文字が左の解答用紙の枠の上にも出る(保存される画像と同じ位置) ---
  // 入力後に枠の中へ文字の画像が出ること、空にすると消えること、ページを送って戻っても残ることを見る。
  // 検査のあとは入力を元に戻し、後続の手順(ショートカット・保存)の前提を変えない
  {
    const typedText = ta.value;
    const probe = () => {
      const rim = q(".es-rim.active");
      if (!rim) return null;
      const id = rim.dataset.fieldId;
      const txt = qa(`.es-rim-text[data-field-id="${id}"]`)[0] || null;
      if (!txt) return { id, display: null };
      const r = rim.getBoundingClientRect();
      const t = txt.getBoundingClientRect();
      return {
        id,
        display: txt.style.display,
        isPng: (txt.getAttribute("src") || "").startsWith("data:image/png;base64,"),
        width: t.width,
        height: t.height,
        centerDx: (t.left + t.width / 2) - (r.left + r.width / 2),
        centerDy: (t.top + t.height / 2) - (r.top + r.height / 2),
        pointerEvents: getComputedStyle(txt).pointerEvents,
      };
    };
    const afterType = probe();
    ta.value = "";
    ta.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(200);
    const afterClear = probe();
    ta.value = typedText;
    ta.dispatchEvent(new Event("input", { bubbles: true }));
    await sleep(200);
    // ページを送って戻る(枠も文字も作り直される)
    const pager = q(".es-viewer-pager");
    const next = pager && pager.querySelector('button[aria-label="次のページ"]');
    const prev = pager && pager.querySelector('button[aria-label="前のページ"]');
    if (next && prev) {
      next.click();
      await sleep(200);
      prev.click();
      await sleep(200);
    }
    results.steps.viewerText = {
      afterType,
      afterClear,
      afterPageRoundTrip: probe(),
      restoredTyped: ta.value === typedText,
    };
  }

  // --- 記号問題(カ): 選択肢を選ぶと左の枠にも文字が出る。←→ で前後へ、無回答で消える ---
  // 既存の答えは「ウ」。ここで「エ」に選び直したままにして、次の保存で送られる内容を見る
  // (選び直したので中央に置き直される。ZIP にも入る)。最後は入力中のイに戻す(後続の手順の前提)
  {
    const chipOf = (ch) => qa(".es-strip-chip").find((c) => (c.textContent || "").includes(ch));
    const btnOf = (label) => qa(".es-choice-btn").find((b) => b.textContent.trim() === label);
    const activeLabel = () => (qa(".es-choice-btn.active")[0]?.textContent || "").trim();
    const shownOf = () => {
      const el = qa('.es-rim-text[data-field-id="6"]')[0];
      return el ? { display: el.style.display, isPng: (el.getAttribute("src") || "").startsWith("data:image/png;base64,") } : null;
    };
    const progressNow = () => (q(".es-progress-count").textContent || "").trim();
    const out = {};
    chipOf("カ").click();
    await sleep(300);
    out.opened = (q(".es-editor-name").textContent || "").trim();
    out.buttons = qa(".es-choice-btn").map((b) => b.textContent.trim());
    out.initialActive = activeLabel();
    out.initialShown = shownOf();
    out.progressBefore = progressNow();

    btnOf("イ").click();
    await sleep(200);
    out.afterPickI = { active: activeLabel(), shown: shownOf() };

    q(".es-choice-list").dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true, composed: true }));
    await sleep(100);
    out.afterRight = activeLabel();

    btnOf("無回答").click();
    await sleep(200);
    out.afterBlank = { active: activeLabel(), shown: shownOf(), progress: progressNow() };

    q(".es-choice-list").dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true, composed: true }));
    await sleep(100);
    out.afterLeft = activeLabel();

    btnOf("エ").click();
    await sleep(200);
    out.final = { active: activeLabel(), shown: shownOf(), progress: progressNow() };

    results.steps.choice = out;
    // 入力中のイに戻す(キーボードショートカットの前提は変えない)
    chipOf("イ").click();
    await sleep(300);
  }

  // --- キーボードショートカット(Ctrl+↵ で次の設問) ---
  // Shadow DOM の外(window)で受けているので composed: true が要る
  const beforeShortcut = (q(".es-editor-name").textContent || "").trim();
  q("textarea.es-textarea").dispatchEvent(
    new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, composed: true }),
  );
  await sleep(400);
  results.steps.shortcut = {
    before: beforeShortcut,
    after: (q(".es-editor-name").textContent || "").trim(),
  };

  // --- 下書き保存の往復 ---
  const saveBtn = visible(".es-save-btn");
  results.steps.save = { disabledBeforeClick: saveBtn.disabled };
  saveBtn.click();
  await waitFor(() => {
    const t = q(".es-save-status").textContent || "";
    return t && !t.includes("保存中");
  }, "save status", 15000);
  await sleep(300);
  results.steps.save.status = q(".es-save-status").textContent;
  results.steps.save.postCount = POST_LOG.length;
  results.steps.save.post = POST_LOG[0] || null;
  results.steps.save.serverTextsAfterSave =
    REPORT.base_sheet_fields.map((f) => ({ id: f.id, text: (f.answer_texts[0] || {}).text || "" }));

  // --- 保存成功でこの端末のバックアップが消える(summary は残ってよい) ---
  results.steps.backupAfterSave = {
    // 下書きのバックアップだけを数える(要約と初回ヒントの表示済みフラグは対象外)
    // 残ってよいキーは許可リストで決める。新しい永続キーを足したらここに足す
    keys: Object.keys(localStorage).filter(
      (k) => k.startsWith("easysmarky:") && !KEEP_AFTER_SAVE.some((p) => k.includes(p)),
    ),
  };

  // beforeunload は preventDefault されたときだけ確認が出る。その有無を見る
  const unloadPrevented = () => {
    const ev = new Event("beforeunload", { cancelable: true });
    window.dispatchEvent(ev);
    return ev.defaultPrevented;
  };

  // --- 編集を再開すると「保存済み」が「未保存の変更あり」に変わる ---
  const statusBeforeEdit = (q(".es-save-status").textContent || "").trim();
  const taAfterSave = q("textarea.es-textarea");
  taAfterSave.value += "続きの文章。";
  taAfterSave.dispatchEvent(new Event("input", { bubbles: true }));
  await sleep(200);
  results.steps.statusClearOnEdit = {
    before: statusBeforeEdit,
    after: (q(".es-save-status").textContent || "").trim(),
  };
  // 未保存の間はタブを閉じる操作で確認を出す
  results.steps.unloadDirty = unloadPrevented();

  // --- 全設問が入ると完了の案内に変わる ---
  // ここまでで ウ が埋まり、5/5 になっている(カは最初から入力済み)
  results.steps.allFilled = {
    progress: (q(".es-progress-count").textContent || "").trim(),
    saveNote: (q(".es-save-note").textContent || "").trim(),
  };

  // --- Alt+↵ は次の未入力へ。無ければ告知する(ボタンは無効化されていてもキーからは届く) ---
  q("textarea.es-textarea").dispatchEvent(
    new KeyboardEvent("keydown", { key: "Enter", altKey: true, bubbles: true, composed: true }),
  );
  await sleep(200);
  const toastAlt = q(".es-toast");
  results.steps.altEnter = { toastText: toastAlt ? toastAlt.textContent : null };

  // --- 最後の設問で進もうとしたら、動けないことを告げる ---
  // 現在は ウ。Ctrl+↵ で オ、もう一度で最後の編集可能な設問 カ(選択式)へ、さらに押すと告知になる
  // 選択式には textarea が無いので、キーは今の入力欄(無ければ選択肢一覧)に送る
  const keyTarget = () => q("textarea.es-textarea") || q(".es-choice-list");
  const ctrlEnter = () =>
    keyTarget().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, composed: true }));
  ctrlEnter();
  await sleep(300);
  ctrlEnter();
  await sleep(300);
  const editorAtLast = (q(".es-editor-name").textContent || "").trim();
  ctrlEnter();
  await sleep(200);
  const toastEnd = q(".es-toast");
  results.steps.edgeEnd = {
    editorAtLast,
    toastText: toastEnd ? toastEnd.textContent : null,
  };

  // 末尾まで行ったので、文字を入れる設問(オ)に戻してから後続の検査へ(以降は textarea を前提にしている)
  qa(".es-strip-chip").find((c) => (c.textContent || "").includes("オ")).click();
  await sleep(300);

  // --- 設問チップは左右キーで隣へフォーカスを移す(開くのは Enter / Space に任せる) ---
  const chipList = qa(".es-strip-chip");
  const editorBeforeArrow = (q(".es-editor-name").textContent || "").trim();
  chipList[0].focus();
  chipList[0].dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true, composed: true }));
  await sleep(100);
  results.steps.stripArrow = {
    focusedIsSecond: shadow().activeElement === chipList[1],
    editorUnchanged: (q(".es-editor-name").textContent || "").trim() === editorBeforeArrow,
  };

  // --- 保存が通信で落ちる → 理由と「入力はこの端末に残っている」を出す ---
  window.__esFail.saveNetwork = true;
  visible(".es-save-btn").click();
  await waitFor(() => (q(".es-save-status").textContent || "").includes("保存に失敗"), "network save fail", 8000);
  await sleep(200);
  results.steps.saveNetworkFail = {
    status: q(".es-save-status").textContent,
    notice: q(".es-error") ? q(".es-error").textContent : "",
    unloadStillPrevented: unloadPrevented(),
  };

  // --- 送信は通ったが照合の再取得が落ちる → 「反映を確認できなかった」と言い、確認済みとは言わない ---
  window.__esFail.verifyOnce = true;
  visible(".es-save-btn").click();
  await waitFor(() => (q(".es-save-status").textContent || "").includes("反映を確認できませんでした"), "verify fail", 8000);
  await sleep(200);
  results.steps.verifyFail = {
    status: q(".es-save-status").textContent,
    postCountAfterVerifyFail: POST_LOG.length,
  };

  // --- 通常の保存で回復すると「保存済み」に戻り、離脱の確認も出なくなる ---
  visible(".es-save-btn").click();
  await waitFor(() => (q(".es-save-status").textContent || "").includes("保存済み"), "recovered save", 8000);
  await sleep(200);
  results.steps.saveRecovered = {
    status: q(".es-save-status").textContent,
    unloadStillPrevented: unloadPrevented(),
  };

  // --- 送信中に編集が入っても、送った内容どおりに照合する(誤った不一致にしない) ---
  // 保存ボタンの直後(同じタスク内)に追記する。送信内容は組み立て済みなので、
  // 保存は成功し、追記ぶんは未保存のまま残るのが正しい
  visible(".es-save-btn").click();
  const taInFlight = q("textarea.es-textarea");
  taInFlight.value += "送信中の追記。";
  taInFlight.dispatchEvent(new Event("input", { bubbles: true }));
  await waitFor(() => {
    const t = q(".es-save-status").textContent || "";
    return t && !t.includes("保存中");
  }, "in-flight save", 8000);
  await sleep(200);
  results.steps.inFlightEdit = {
    status: q(".es-save-status").textContent,
    notice: q(".es-error") ? q(".es-error").textContent : "",
  };

  // --- 記号問題を「無回答」にして保存する。公式と同じ 1x1 の空スタンプとして送られる ---
  {
    const chipOfKa = qa(".es-strip-chip").find((c) => (c.textContent || "").includes("カ"));
    chipOfKa.click();
    await sleep(300);
    qa(".es-choice-btn").find((b) => b.textContent.trim() === "無回答").click();
    await sleep(200);
    visible(".es-save-btn").click();
    await waitFor(() => {
      const t = q(".es-save-status").textContent || "";
      return t && !t.includes("保存中");
    }, "blank choice save", 8000);
    await sleep(200);
    const lastPost = POST_LOG[POST_LOG.length - 1];
    const choicePost = lastPost && lastPost.answerTexts ? lastPost.answerTexts.find((p) => p.id === 6) : null;
    results.steps.choiceBlankSave = {
      status: q(".es-save-status").textContent,
      stamps: choicePost ? choicePost.answer_texts : null,
    };
    // 入力中のイに戻す(後続の離脱・Esc の検査は textarea を前提にしている)
    qa(".es-strip-chip").find((c) => (c.textContent || "").includes("イ")).click();
    await sleep(300);
  }

  // --- 背景スクロールのロック ---
  results.steps.scrollLock = {
    html: document.documentElement.style.overflow,
    body: document.body.style.overflow,
  };

  // --- 未保存のまま閉じる操作は確認を通す(確認でやめれば閉じない、OKなら閉じる) ---
  // 確認ダイアログはヘッドレスで CDP を止めてしまうので window.confirm を差し替えて判定する
  const confirmCalls = [];
  window.__esConfirmAnswer = false;
  window.confirm = (msg) => {
    confirmCalls.push(String(msg));
    return window.__esConfirmAnswer;
  };
  const taDirty = q("textarea.es-textarea");
  taDirty.value += "確認用の追記。";
  taDirty.dispatchEvent(new Event("input", { bubbles: true }));
  await sleep(150);

  // 「閉じる」と「← 科目一覧」も、未保存なら確認を通す(やめれば、そのまま留まる)
  const hostBtnCheck = document.getElementById("easysmarky-host");
  q(".es-close").click();
  await sleep(100);
  const closeDeclined = {
    confirmCount: confirmCalls.length,
    hostVisible: hostBtnCheck.style.display !== "none",
  };
  q(".es-header-back").click();
  await sleep(100);
  results.steps.leaveButtons = {
    close: closeDeclined,
    backConfirmCount: confirmCalls.length - closeDeclined.confirmCount,
    stillOnForm: !!q(".es-form"),
  };
  confirmCalls.length = 0;

  // --- Esc で閉じる(1回目は入力欄からフォーカスを外すだけ) ---
  // 必ず最後に置く(閉じるとこの先の操作ができなくなるため)
  const hostEl = document.getElementById("easysmarky-host");
  const taEsc = q("textarea.es-textarea");
  taEsc.focus();
  await sleep(100);
  const activeIsTextareaBefore = shadow().activeElement === taEsc;
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  await sleep(100);
  const activeIsTextareaAfterFirst = shadow().activeElement === taEsc;
  const hostVisibleAfterFirst = hostEl.style.display !== "none";
  // 2回目: 未保存なので確認が出て、やめたら閉じない
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  await sleep(100);
  const confirmCountDeclined = confirmCalls.length;
  const hostVisibleAfterDeclined = hostEl.style.display !== "none";
  // 3回目: 確認でOKすると閉じる
  window.__esConfirmAnswer = true;
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  await sleep(100);
  results.steps.escClose = {
    activeIsTextareaBefore,
    activeIsTextareaAfterFirst,
    hostVisibleAfterFirst,
    confirmCountDeclined,
    hostVisibleAfterDeclined,
    confirmMessage: confirmCalls[0] || "",
    hostVisibleAfterConfirmed: hostEl.style.display !== "none",
  };

  return results;
}

async function runView(mode) {
  const want = mode || MODE;
  if (want === "list") {
    await waitFor(() => q(".es-list-item"), "sheet list");
    await sleep(300);
    return { mode: "view", view: want };
  }
  if (!q(".es-form")) {
    await openSheet();
    // 下書きが入っている状態で見た目を確認したいので、空の設問にも入力しておく
    visible(".es-next-btn").click();
    await sleep(400);
    const ta = q("textarea.es-textarea");
    if (ta && !ta.value) {
      ta.value = "都市部へ人口が流出し、地域の担い手が不足した。";
      ta.dispatchEvent(new Event("input", { bubbles: true }));
    }
    await sleep(600);
    viewerTab("解答用紙").click();
    await sleep(500);
  }
  if (want === "edit") {
    // 常時分割レイアウトでは問題ビューアは隠れないので、rimタップは
    // 「その設問を選んでテキストエリアにフォーカスする」だけの意味になる
    const rim = qa(".es-rim")[0];
    if (rim) rim.click(); else qa(".es-strip-chip")[0].click();
  }
  if (want === "tall") {
    // 縦長の解答欄(設問オ)。canvas の max-height が当たる唯一の設問なので、
    // 「高さで頭打ちにしたぶん幅も縮んで縦横比が保たれている」ことを目視できる1枚
    qa(".es-strip-chip")[4].click();
  }
  await sleep(900);
  return { mode: "view", view: want };
}

// CDPドライバから呼ぶ用(実時間で動く。--virtual-time-budget では
// ResizeObserver の配信タイミングが実機と変わるため、こちらを本命にする)
window.__esAssert = () => runAssertions();
window.__esView = (mode) => runView(mode);

if (AUTO) {
  window.addEventListener("load", async () => {
    const out = document.getElementById("es-results");
    try {
      const res = AUTO === "view" ? await runView(MODE) : await runAssertions();
      out.textContent = "RESULTS " + JSON.stringify(res, null, 1);
    } catch (e) {
      out.textContent = "RESULTS " + JSON.stringify({ fatal: String(e && e.stack || e) }, null, 1);
    }
  });
}
</script>
<script src="/dist/easysmarky.iife.js"></script>
