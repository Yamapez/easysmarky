<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easysmarky harness</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  .filler { height: 2000px; background: linear-gradient(#fafafa, #ddd); padding: 20px; }
  #es-results { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<h1>ホストページ(Smarky代わり)</h1>
<pre id="es-results">PENDING</pre>
<div class="filler">背後のページ。オーバーレイ表示中はスクロールしないはず。</div>

<script>
// ============================================================
// ダミーのページ画像
//
// 実機の Smarky では、ページ画像の解像度が base_sheet の座標系(SHEET_W×SHEET_H)と
// 一致するとは限らない。ここをわざと食い違わせておかないと、rim をそのまま画像ピクセルと
// して扱う実装ミス(= 解答欄プレビューの切り出し範囲がズレる)を検出できない。
// 描画はすべて base_sheet 座標で書き、ctx.scale() で解像度倍率を掛ける。
// ============================================================
const SHEET_W = 1000;
const SHEET_H = 1400;
/** 解答用紙画像の解像度倍率。base_sheet 座標 × これ = 画像ピクセル */
const ANSWER_IMAGE_SCALE = 2;
/** 問題ページ画像の解像度倍率(解答用紙とも違う値にしておく) */
const QUESTION_IMAGE_SCALE = 1.5;
const PAGE_BG_ANSWER = "#fffdf5";

// 解答欄の唯一の出所。REPORT の rim も、ページ画像に描く枠も、ここから作る。
// 塗り色は「切り出した範囲が本当に解答欄と重なっているか」を画素で確かめるための目印。
const RIMS = [
  { id: 1, part3: "ア", rim: [40, 400, 920, 120], fill: "#ffe3e3" },
  { id: 2, part3: "イ", rim: [40, 600, 920, 120], fill: "#e3ffe8" },
  // 用紙の左端に接する解答欄。cut_margin ぶんが用紙の外へ出るので、
  // 切り出しのクランプ(src/ui/cropPreview.ts)が効いているかをここで見る。
  { id: 3, part3: "ウ", rim: [0, 800, 960, 120], fill: "#e3e9ff" },
];

function makePage(text, lines, bg, scale) {
  const c = document.createElement("canvas");
  c.width = SHEET_W * scale; c.height = SHEET_H * scale;
  const g = c.getContext("2d");
  g.scale(scale, scale);
  g.fillStyle = bg; g.fillRect(0, 0, SHEET_W, SHEET_H);
  g.fillStyle = "#111";
  g.font = "bold 34px sans-serif";
  g.fillText(text, 40, 60);
  g.font = "26px sans-serif";
  lines.forEach((l, i) => g.fillText(l, 40, 130 + i * 44));
  for (const r of RIMS) {
    const [x, y, w, h] = r.rim;
    g.fillStyle = r.fill;
    g.fillRect(x, y, w, h);
    g.strokeStyle = "#888"; g.lineWidth = 2;
    g.strokeRect(x, y, w, h);
  }
  return c.toDataURL("image/png");
}

const QUESTION_PAGE_1 = makePage("問題 第1回", [
  "問1 次の文章を読んで、下の問いに答えなさい。",
  "  日本の高度経済成長期には、都市部への人口集中が進み、",
  "  地方では過疎化が問題となった。",
  "(1) 高度経済成長期はおよそ何年から何年までか答えなさい。",
  "(2) 過疎化が地域社会に与えた影響を60字以内で述べなさい。",
], "#ffffff", QUESTION_IMAGE_SCALE);

const QUESTION_PAGE_2 = makePage("問題 第1回(2ページ目)", [
  "問2 次の語句について説明しなさい。",
  "(1) ドーナツ化現象",
  "(2) Uターン現象",
], "#ffffff", QUESTION_IMAGE_SCALE);

const ANSWER_PAGE_1 = makePage("解答用紙 第1回", [
  "問1(1) 解答欄 ↓",
], PAGE_BG_ANSWER, ANSWER_IMAGE_SCALE);

// ============================================================
// ダミーAPIレスポンス
// ============================================================
const CURRENT_USER = {
  user: { login_id: "85_2025HF249", id: 1, role: "student", name: "テスト太郎",
          school: { id: 85, name: "テスト高校" } },
};

const SHEET_LIST = {
  student_subject_rows: [{
    student_subject: { subject_code: "JPN", nendo: 2025, report_count: 1, subject_name: "国語総合" },
    student_sheets: [null],
    base_sheets: [{
      id: 1001, sheet_code: "JPN-1", report_no: 1, answer_image_completed: false,
      is_published: true, publish_at: null,
      std_deadline_at: "2026-08-31T00:00:00Z", final_deadline_at: null, sheet_type: 1,
    }],
  }],
  max_report_count: 1, report_nos: [1], sheet_types: [1],
};

function field(id, part3, rim, answerTexts) {
  return {
    id, page: 1, kind: 0, part1: "問1", part2: "(1)", part3,
    allot: 5, rim, answer_type: 1,
    answer_texts: answerTexts || [], answer_images: [], base64_canvas: null, choice_texts: [],
  };
}

// 設問1は「下書きを再開した」状態を再現するため、既存の answer_texts を持たせる。
// これが無いと updatePreview() の空テキスト早期returnに入り、
// スマホ初期表示(入力ペインが display:none)からの復帰経路を検証できない。
const EXISTING_TEXT = {
  id: 11, base_sheet_field_id: 1, idx: 0,
  text: "既存の下書きテキスト", color: "#000000",
  font_size: 40, line_height: 1.2,
  x: null, y: null, width: null, height: null, direction: 1,
};

const REPORT = {
  base_sheet: { id: 1001, width: SHEET_W, height: SHEET_H, sheet_type: 1 },
  base_sheet_fields: RIMS.map((r, i) =>
    field(r.id, r.part3, r.rim, i === 0 ? [EXISTING_TEXT] : [])),
  base64_question_images: [QUESTION_PAGE_1, QUESTION_PAGE_2],
  base64_answer_images: [ANSWER_PAGE_1],
  message: null, before_student_sheet_id: null, subject_name: "国語総合 第1回",
  cut_margin: 20, scored_user_name: null,
  answer_image_discriptions: [], question_image_discriptions: [],
  rejection_student_sheet_log: null, status: 1, movie_contents: [],
};

// ============================================================
// fetch スタブ(保存はステートフル: 保存された answer_texts を REPORT に書き戻す)
// ============================================================
const POST_LOG = [];
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = String(input);
  const json = (obj) => new Response(JSON.stringify(obj), {
    status: 200, headers: { "Content-Type": "application/json" },
  });
  if (url.startsWith("/api/current_user")) return json(CURRENT_USER);
  if (url.startsWith("/api/student/student_sheet_list")) return json(SHEET_LIST);

  if (url.startsWith("/api/student/digital_report/save")) {
    const form = init && init.body;
    const entry = { zipBytes: null, fieldCount: 0, texts: [], error: null };
    try {
      const file = form.get("file");
      entry.zipBytes = file ? file.size : null;
      const params = JSON.parse(form.get("param_base_sheet_fields"));
      entry.fieldCount = params.length;
      // 実サーバと同じく、保存された内容が以後のGETに反映されるようにする
      for (const p of params) {
        const target = REPORT.base_sheet_fields.find((f) => f.id === p.id);
        if (target) target.answer_texts = p.answer_texts || [];
        entry.texts.push({ id: p.id, text: (p.answer_texts && p.answer_texts[0] && p.answer_texts[0].text) || "" });
      }
    } catch (e) {
      entry.error = String(e);
    }
    POST_LOG.push(entry);
    return json({ ok: true });
  }

  if (url.startsWith("/api/student/digital_report")) return json(REPORT);
  return realFetch(input, init);
};

// 前回の実行が残した下書き・進捗キャッシュを消してから始める
try {
  for (const key of Object.keys(localStorage)) {
    if (key.startsWith("easysmarky:")) localStorage.removeItem(key);
  }
} catch (e) { /* localStorage が使えない環境は無視 */ }

// ============================================================
// 自動駆動 (?auto=assert | ?auto=view)
// ============================================================
const params = new URLSearchParams(location.search);
const AUTO = params.get("auto");
const MODE = params.get("mode") || "view";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, label, timeout = 8000) {
  const start = Date.now();
  for (;;) {
    let v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    if (Date.now() - start > timeout) throw new Error("timeout waiting for " + label);
    await sleep(50);
  }
}
const shadow = () => {
  const host = document.getElementById("easysmarky-host");
  return host && host.shadowRoot;
};
const q = (sel) => { const s = shadow(); return s && s.querySelector(sel); };
const qa = (sel) => { const s = shadow(); return s ? Array.from(s.querySelectorAll(sel)) : []; };
/** 同じクラスの要素がPC用/スマホ用に複数あるので、いま画面に出ている方を選ぶ */
const visible = (sel) => qa(sel).find((el) => el.getBoundingClientRect().width > 0) || null;

/** 表示中の1設問エディタのプレビュー状態 */
function overlayState() {
  const wrap = q(".es-preview-wrap");
  if (!wrap) return null;
  const canvas = wrap.querySelector("canvas.es-crop");
  const img = wrap.querySelector(".es-preview-overlay");
  if (!canvas || !img) return null;
  const box = canvas.getBoundingClientRect();
  const px = (v) => (v ? parseFloat(v) : null);
  return {
    renderedWidth: Math.round(box.width * 100) / 100,
    renderedHeight: Math.round(box.height * 100) / 100,
    // canvas の内部解像度は「ページ画像のピクセル数」であって base_sheet の座標系ではない
    intrinsicWidth: canvas.width,
    intrinsicHeight: canvas.height,
    display: img.style.display,
    width: img.style.width,
    left: img.style.left,
    // 文字画像の中心。解答欄の中心と一致しているはず(フォント実測値に依存しない検査)
    centerX: px(img.style.left) != null ? px(img.style.left) + px(img.style.width) / 2 : null,
    centerY: px(img.style.top) != null ? px(img.style.top) + px(img.style.height) / 2 : null,
    // updatePreview が使うスケールと、実際に当たっている幅の比が一致するか照合する材料
    scale: canvas.width ? Math.round((box.width / canvas.width) * 10000) / 10000 : null,
  };
}

/** 切り出し canvas の内部解像度。非表示でも読める(display:none でも width 属性は残る) */
function cropSize(sel) {
  const c = q(sel);
  return c ? { intrinsicWidth: c.width, intrinsicHeight: c.height } : null;
}

/**
 * 切り出し canvas の画素を1点だけ読む(fx,fy は 0..1 の相対位置)。
 * ページ画像は同一オリジンの data URL なので canvas は汚染されず getImageData が使える。
 * 切り出しは等倍(ソース矩形 = destサイズ)なのでリサンプリングされず、色は完全一致で比べられる。
 */
function cropPixel(sel, fx, fy) {
  const c = q(sel);
  if (!c || !c.width) return null;
  const x = Math.min(c.width - 1, Math.max(0, Math.round(c.width * fx)));
  const y = Math.min(c.height - 1, Math.max(0, Math.round(c.height * fy)));
  const d = c.getContext("2d").getImageData(x, y, 1, 1).data;
  return "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
}

function viewerTab(label) {
  return qa(".es-viewer-tabs button").find((b) => b.textContent === label) || null;
}

async function openSheet() {
  await waitFor(() => q(".es-list-item"), "sheet list");
  q(".es-list-item").click();
  await waitFor(() => q(".es-form"), "form");
  await waitFor(() => q(".es-field-editor .es-preview-wrap"), "field editor");
  await sleep(600); // 画像デコード + 初回プレビュー描画待ち
}

async function runAssertions() {
  const results = { mode: "assert", viewport: { w: innerWidth, h: innerHeight }, steps: {} };
  const t0 = Date.now();

  await openSheet();

  const form = q(".es-form");
  const isTwoPane = matchMedia("(min-width: 900px)").matches;

  // 入力ペインの表示/非表示の切り替わりを記録する。ここが 0 → N に変わったときに
  // fieldEditor の ResizeObserver が発火し、プレビューが描かれる。
  const probeLog = [];
  const probeRO = new ResizeObserver((entries) => {
    for (const e of entries) probeLog.push({ at: Date.now() - t0, w: Math.round(e.contentRect.width * 100) / 100 });
  });
  probeRO.observe(q(".es-pane-form"));
  await sleep(300);

  results.steps.initial = {
    dataMode: form.dataset.mode,
    twoPaneMediaQuery: isTwoPane,
    questionPaneDisplay: getComputedStyle(q(".es-pane-question")).display,
    formPaneDisplay: getComputedStyle(q(".es-pane-form")).display,
    stripChips: qa(".es-strip-chip").length,
    editorName: (q(".es-editor-name").textContent || "").trim(),
    progress: (q(".es-progress-count").textContent || "").trim(),
    // 初期表示は「問題」ページなので解答欄の枠は出ない(rim座標は解答用紙のもの)
    rimCount: qa(".es-rim").length,
    field1: overlayState(),
    // 切り出しの内部解像度は「ページ画像のピクセル」。rim をそのまま画像座標として
    // 使っていると、解答用紙が2倍解像度なので半分のサイズになる
    field1Crop: cropSize(".es-preview-wrap canvas.es-crop"),
    field1CropPixels: {
      center: cropPixel(".es-preview-wrap canvas.es-crop", 0.5, 0.5),     // 解答欄1の塗り色のはず
      margin: cropPixel(".es-preview-wrap canvas.es-crop", 0.004, 0.05),  // cut_margin の外側 = 用紙の地色
    },
    // 問題ページは解答用紙とさらに別解像度。各画像の naturalWidth で換算されているはず
    questionCrop: cropSize(".es-crop-question"),
    // 解答欄プレビューの横に置く問題プレビュー(目安の切り出し)はPC幅だけで見えるはず
    questionPreviewDisplay: getComputedStyle(q(".es-question-preview")).display,
    questionPreviewCanvasWidth: (() => {
      const c = q(".es-crop-question");
      return c ? Math.round(c.getBoundingClientRect().width) : null;
    })(),
  };

  // --- 解答用紙タブ: 解答欄の枠と凡例が出るか ---
  viewerTab("解答用紙").click();
  await sleep(400);
  results.steps.answerSheet = {
    rimCount: qa(".es-rim").length,
    filledRims: qa(".es-rim.filled").length,
    activeRims: qa(".es-rim.active").length,
    legendDisplay: getComputedStyle(q(".es-viewer-legend")).display,
    firstRimStyle: (() => {
      const r = qa(".es-rim")[0];
      return r ? { left: r.style.left, top: r.style.top, width: r.style.width, height: r.style.height } : null;
    })(),
  };

  // --- 最重要: 解答欄をタップ → 入力に入ったときにプレビューが描かれるか ---
  // スマホは入力ペインが display:none で始まるため、描画経路は
  // 「編集モードに入って ResizeObserver が発火する」ときだけになる。
  const probeBeforeTap = probeLog.length;
  qa(".es-rim")[0].click();
  await sleep(1200);
  results.steps.afterRimTap = {
    dataMode: form.dataset.mode,
    editorName: (q(".es-editor-name").textContent || "").trim(),
    field1: overlayState(),
    paneResizesOnTap: probeLog.length - probeBeforeTap,
    probeLog: probeLog.slice(),
  };

  // --- 設問ストリップで移動できるか ---
  qa(".es-strip-chip")[2].click();
  await sleep(500);
  results.steps.stripNav = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    activeChipIndex: qa(".es-strip-chip").findIndex((c) => c.classList.contains("active")),
    dataMode: form.dataset.mode,
    // 設問3は用紙の左端に接する解答欄。切り出しが用紙の外へ出ないかを見る
    field3Crop: cropSize(".es-preview-wrap canvas.es-crop"),
    field3CenterPixel: cropPixel(".es-preview-wrap canvas.es-crop", 0.5, 0.5),
  };

  // --- ResizeObserver: 幅を変えたら再計算されるか / ping-pong しないか ---
  // (既存テキストのある設問1に戻してから測る)
  qa(".es-strip-chip")[0].click();
  await sleep(700);
  const formPane = q(".es-pane-form");
  const img1 = q(".es-preview-overlay");
  let mutations = 0;
  const mo = new MutationObserver(() => { mutations++; });
  mo.observe(img1, { attributes: true, attributeFilter: ["style", "src"] });

  const before = overlayState();
  formPane.style.maxWidth = "320px";
  await sleep(400);
  const mutAt400 = mutations;
  const afterShrink = overlayState();
  await sleep(900);
  const mutAt1300 = mutations;

  formPane.style.maxWidth = "";
  await sleep(900);
  const afterRestore = overlayState();
  mo.disconnect();
  probeRO.disconnect();

  // overlayImg の幅は「テキストPNGの実寸 × scale」なので、
  // scale に比例していれば再計算が正しく効いている
  const ratio = (s) => (s && s.width && s.scale ? Math.round((parseFloat(s.width) / s.scale) * 100) / 100 : null);

  results.steps.resize = {
    before, afterShrink, afterRestore,
    pngWidthBefore: ratio(before),
    pngWidthAfterShrink: ratio(afterShrink),
    pngWidthAfterRestore: ratio(afterRestore),
    // 同じテキストなら PNG 実寸は変わらないはず。ズレていれば再計算が漏れている
    rescaledCorrectly:
      ratio(afterShrink) !== null && ratio(afterRestore) !== null
        ? Math.abs(ratio(afterShrink) - ratio(afterRestore)) < 1
        : null,
    mutationCallbacksAt400ms: mutAt400,
    mutationCallbacksAt1300ms: mutAt1300,
  };

  // --- 「次の未入力へ」で未入力の設問に移るか ---
  visible(".es-next-btn").click();
  await sleep(500);
  results.steps.nextEmpty = {
    editorName: (q(".es-editor-name").textContent || "").trim(),
    dataMode: form.dataset.mode,
    textareaValue: q("textarea.es-textarea").value,
  };

  // --- 入力 → プレビュー・進捗・ストリップの更新 ---
  const ta = q("textarea.es-textarea");
  ta.value = "都市部へ人口が流出し、地域の担い手が不足した。";
  ta.dispatchEvent(new Event("input", { bubbles: true }));
  await sleep(600);
  results.steps.typed = {
    field: overlayState(),
    progress: (q(".es-progress-count").textContent || "").trim(),
    filledDots: qa(".es-strip-dot.filled").length,
    fit: (q(".es-fit").textContent || "").trim(),
  };

  // --- キーボードショートカット(Ctrl+↵ で次の設問) ---
  // Shadow DOM の外(window)で受けているので composed: true が要る
  const beforeShortcut = (q(".es-editor-name").textContent || "").trim();
  q("textarea.es-textarea").dispatchEvent(
    new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true, composed: true }),
  );
  await sleep(400);
  results.steps.shortcut = {
    before: beforeShortcut,
    after: (q(".es-editor-name").textContent || "").trim(),
  };

  // --- 下書き保存の往復 ---
  const saveBtn = visible(".es-save-btn");
  results.steps.save = { disabledBeforeClick: saveBtn.disabled };
  saveBtn.click();
  await waitFor(() => {
    const t = q(".es-save-status").textContent || "";
    return t && !t.includes("保存中");
  }, "save status", 15000);
  await sleep(300);
  results.steps.save.status = q(".es-save-status").textContent;
  results.steps.save.postCount = POST_LOG.length;
  results.steps.save.post = POST_LOG[0] || null;
  results.steps.save.serverTextsAfterSave =
    REPORT.base_sheet_fields.map((f) => ({ id: f.id, text: (f.answer_texts[0] || {}).text || "" }));

  // --- 背景スクロールのロック ---
  results.steps.scrollLock = {
    html: document.documentElement.style.overflow,
    body: document.body.style.overflow,
  };

  return results;
}

async function runView(mode) {
  const want = mode || MODE;
  if (want === "list") {
    await waitFor(() => q(".es-list-item"), "sheet list");
    await sleep(300);
    return { mode: "view", view: want };
  }
  if (!q(".es-form")) {
    await openSheet();
    // 下書きが入っている状態で見た目を確認したいので、空の設問にも入力しておく
    visible(".es-next-btn").click();
    await sleep(400);
    const ta = q("textarea.es-textarea");
    if (ta && !ta.value) {
      ta.value = "都市部へ人口が流出し、地域の担い手が不足した。";
      ta.dispatchEvent(new Event("input", { bubbles: true }));
    }
    await sleep(600);
    viewerTab("解答用紙").click();
    await sleep(500);
  }
  if (want === "edit") {
    qa(".es-rim")[0].click();
  } else {
    const back = visible(".es-editor-back");
    if (back) back.click();
  }
  await sleep(900);
  return { mode: "view", view: want, dataMode: q(".es-form").dataset.mode };
}

// CDPドライバから呼ぶ用(実時間で動く。--virtual-time-budget では
// ResizeObserver の配信タイミングが実機と変わるため、こちらを本命にする)
window.__esAssert = () => runAssertions();
window.__esView = (mode) => runView(mode);

if (AUTO) {
  window.addEventListener("load", async () => {
    const out = document.getElementById("es-results");
    try {
      const res = AUTO === "view" ? await runView(MODE) : await runAssertions();
      out.textContent = "RESULTS " + JSON.stringify(res, null, 1);
    } catch (e) {
      out.textContent = "RESULTS " + JSON.stringify({ fatal: String(e && e.stack || e) }, null, 1);
    }
  });
}
</script>
<script src="/dist/easysmarky.iife.js"></script>
</body>
</html>
